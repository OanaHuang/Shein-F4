experiment: NGBOOST
protocol: asof_deploy_C_v1
splits: configs/splits_deploy_C.yaml
features: shared_fields_v1
ngboost:
  include_right_censored: false
model:
  learning_rate: 0.02
  max_depth: 3
  min_samples_leaf: 200
  n_estimators: 250
  minibatch_frac: 0.25
  n_jobs: 1
  random_state: 2026
execution:
  stage: preparation
  allow_real_training: false
  cpu_threads: 1
  parallel_models: false
