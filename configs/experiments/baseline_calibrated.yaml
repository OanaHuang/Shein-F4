# Fair ablation: compare B1 and LightGBM under the same independent calibration.
# Preparation only. This variant has not been authorized for real fitting.
experiment: B1
protocol: asof_backtest
splits: configs/splits.yaml
features: shared_fields_v1
model:
  kind: carrier_constant
  quantiles: [0.90, 0.97]
  min_group_samples: 200
calibration:
  enabled: true
  method: independent_carrier_residual
  min_group_samples: 200
execution:
  stage: preparation
  allow_real_training: false
  parallel_models: false
