experiment: M2
model_family: lightgbm
target: remaining
protocol: asof_backtest
splits: configs/splits.yaml
features: shared_fields_v1
model:
  alphas: [0.90, 0.97]
  n_estimators: 800
  n_jobs: 4
  learning_rate: 0.05
  num_leaves: 31
  min_child_samples: 200
  reg_lambda: 5.0
  force_col_wise: true
  random_state: 2026
calibration:
  min_group_samples: 200
execution:
  stage: preparation
  allow_real_training: false
  parallel_models: false
