experiment: M2
model_family: catboost
target: total
protocol: asof_backtest
splits: configs/splits.yaml
features: shared_fields_v1
model:
  alphas: [0.90, 0.97]
  n_estimators: 800
  n_jobs: 4
  learning_rate: 0.05
  depth: 6
  l2_leaf_reg: 5.0
  border_count: 64
  random_seed: 2026
calibration:
  min_group_samples: 200
execution:
  stage: preparation
  allow_real_training: false
  parallel_models: false
